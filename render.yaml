services:
  - type: web
    name: educore-app
    runtime: node
    plan: starter
    buildCommand: pnpm install --prod=false --ignore-scripts && pnpm --filter @schoolmitra/database db:migrate && pnpm --filter @schoolmitra/database db:seed-coa && pnpm exec turbo run build
    preDeployCommand: pnpm --filter @schoolmitra/database db:migrate && pnpm --filter @schoolmitra/database db:seed-coa
    startCommand: pnpm -w run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: educore-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: IMPERSONATION_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_DLT_PE_ID
        sync: false
      - key: SMS_DLT_TEMPLATE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "SchoolMitra Notifications <notifications@schoolmitra.in>"

  - type: worker
    name: educore-finance-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --prod=false --ignore-scripts && pnpm exec turbo run build
    startCommand: pnpm --filter @schoolmitra/backend run worker:finance
    envVars:
      - key: NODE_ENV
        value: production
      - key: START_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: educore-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

databases:
  - name: educore-db
    plan: starter
    databaseName: schoolmitra_erp
    user: schoolmitra
