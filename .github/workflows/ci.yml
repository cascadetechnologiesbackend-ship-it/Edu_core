name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint, Test & Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolmitra
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: schoolmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: test-ci-secret-value-must-be-at-least-32-chars-long-here
      NEXTAUTH_SECRET: test-ci-secret-value-must-be-at-least-32-chars-long-here
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY_ID: k1
      ENCRYPTION_KEYRING: '{"k1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckj0Gy2TXRwyLx9xWQndBIQeM2QVKE
      VAPID_PRIVATE_KEY: test-ci-vapid-private-key-must-be-32-chars
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Transcript & Secret Leak Guard (S3-T0)
        shell: bash
        run: |
          if find . -type f \( -name "*retrieved_chat_history*" -o -name "*.db-wal" -o -name "*.db-shm" \) | grep -q .; then
            echo "❌ Error: Conversation transcript or SQLite DB artifact detected in repository!"
            find . -type f \( -name "*retrieved_chat_history*" -o -name "*.db-wal" -o -name "*.db-shm" \)
            exit 1
          fi
          echo "✅ Repository clean of conversation transcripts and SQLite lockfiles."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.7.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Migration Sequence & Journal
        run: pnpm --filter @schoolmitra/database run db:check-migrations

      - name: Monorepo Type Check (All 7 Workspace Packages)
        run: pnpm run type-check

      - name: Run Monorepo Lint
        run: pnpm --filter @schoolmitra/frontend run lint

      - name: Run Database Migrations (Owner / Superuser Identity)
        run: pnpm --filter @schoolmitra/database run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test
          DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test

      - name: Run Backend Unit & Integration Tests (Non-Owner Role S5-T3)
        run: pnpm --filter @schoolmitra/backend run test
        env:
          MIGRATION_DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test
          DATABASE_URL: postgresql://schoolmitra_app_login:schoolmitra_app_secure@localhost:5432/schoolmitra_test

      - name: Run Frontend Unit Tests
        run: pnpm --filter @schoolmitra/frontend run test

      - name: Next.js Bundle Analysis & Budget Enforcement (PF-R02)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ENCRYPTION_KEY: e29ed7af4c54ed20a650cd257398652e3dc54b1fc4800b77900192c088532283
          ENCRYPTION_KEYRING: '{"k1":"e29ed7af4c54ed20a650cd257398652e3dc54b1fc4800b77900192c088532283"}'
        run: |
          pnpm --filter @schoolmitra/frontend run build
          node frontend/scripts/check-bundle-budgets.mjs

      - name: Set up Database & Seed for Playwright E2E
        run: |
          pnpm --filter @schoolmitra/database run db:seed
          pnpm --filter @schoolmitra/database run db:seed-coa
        env:
          MIGRATION_DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test
          DATABASE_URL: postgresql://schoolmitra:password123@localhost:5432/schoolmitra_test

      - name: Install Playwright Chromium
        run: pnpm --filter @schoolmitra/frontend exec playwright install --with-deps chromium

      - name: Run Playwright Core E2E Tests (Non-Owner Identity S6-T3)
        env:
          DATABASE_URL: postgresql://schoolmitra_app_login:schoolmitra_app_secure@localhost:5432/schoolmitra_test
          ENCRYPTION_KEY: e29ed7af4c54ed20a650cd257398652e3dc54b1fc4800b77900192c088532283
          ENCRYPTION_KEYRING: '{"k1":"e29ed7af4c54ed20a650cd257398652e3dc54b1fc4800b77900192c088532283"}'
        run: |
          pnpm --filter @schoolmitra/frontend start -p 3002 &
          for i in {1..30}; do
            curl -s http://localhost:3002/api/health >/dev/null && break || sleep 2
          done
          pnpm --filter @schoolmitra/frontend exec playwright test e2e/p3-rbac-drill.spec.ts e2e/multitenancy.spec.ts e2e/finance-flows.spec.ts e2e/superadmin-impersonation.spec.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: schoolmitra/erp:ci-test

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
